<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <style>
    .bx { fill:#4b5563; fill-opacity:.10; stroke:#6b7280; stroke-width:1.5; rx:8 }
    .pub{ fill:#15803d; fill-opacity:.12; stroke:#15803d; stroke-width:1.8; rx:8 }
    .prv{ fill:#6b7280; fill-opacity:.08; stroke:#9ca3af; stroke-width:1.5; rx:8; stroke-dasharray:5 3 }
    .hld{ fill:#b45309; fill-opacity:.12; stroke:#b45309; stroke-width:1.8; rx:8 }
    .t  { fill:#6b7280; font-size:12.5px }
    .ttl{ fill:#374151; font-size:13.5px; font-weight:600 }
    .h  { fill:#374151; font-size:16px; font-weight:700 }
    .sm { fill:#9ca3af; font-size:11.5px }
    .ar { stroke:#9ca3af; stroke-width:1.6; fill:none; marker-end:url(#d) }
    .wt { fill:#b45309; font-size:12px; font-weight:600 }
    @media (prefers-color-scheme: dark){
      .t{fill:#9ca3af} .ttl{fill:#d1d5db} .h{fill:#e5e7eb} .sm{fill:#6b7280}
    }
  </style>
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>

  <text x="24" y="30" class="h">Preregistration to result — what a reader can and cannot check</text>
  <text x="24" y="50" class="sm">Diagram (not a screenshot). Example: the basis-dislocation study in research/basis-dislocation/.</text>

  <rect x="24" y="80" width="200" height="104" class="pub"/>
  <text x="36" y="105" class="ttl">1. Preregistration</text>
  <text x="36" y="124" class="t">three-way date split,</text>
  <text x="36" y="142" class="t">thresholds frozen per pair,</text>
  <text x="36" y="160" class="t">kill conditions, 58 bps hurdle,</text>
  <text x="36" y="178" class="t">family stopping rule</text>

  <rect x="256" y="80" width="176" height="104" class="prv"/>
  <text x="268" y="105" class="ttl">2. Commit + push</text>
  <text x="268" y="124" class="t">private repository</text>
  <text x="268" y="142" class="t">commit cc0660a</text>
  <text x="268" y="160" class="wt">not publicly</text>
  <text x="268" y="178" class="wt">verifiable</text>

  <rect x="464" y="80" width="176" height="104" class="bx"/>
  <text x="476" y="105" class="ttl">3. VALIDATE</text>
  <text x="476" y="124" class="t">public kline archives</text>
  <text x="476" y="142" class="t">n = 82,619</text>
  <text x="476" y="160" class="t">+3.78 bps</text>
  <text x="476" y="178" class="t">90% CI [+2.69, +4.91]</text>

  <rect x="672" y="80" width="204" height="104" class="hld"/>
  <text x="684" y="105" class="ttl">4. HOLDOUT</text>
  <text x="684" y="124" class="t">opened only after the</text>
  <text x="684" y="142" class="t">verdict was committed</text>
  <text x="684" y="160" class="t">n = 90,556 · +1.23 bps</text>
  <text x="684" y="178" class="wt">CI [−0.04, +2.50] — touches 0</text>

  <path class="ar" d="M224 132 L252 132"/>
  <path class="ar" d="M432 132 L460 132"/>
  <path class="ar" d="M640 132 L668 132"/>

  <rect x="24" y="212" width="852" height="52" class="bx"/>
  <text x="36" y="236" class="ttl">Verdict: DEAD on the hurdle — and the family stopping rule fired</text>
  <text x="36" y="255" class="t">A small directional effect in validation, materially weaker in the frozen holdout, far below trading costs throughout.</text>

  <rect x="24" y="292" width="420" height="122" class="pub"/>
  <text x="36" y="317" class="ttl">A public reader CAN check</text>
  <text x="36" y="337" class="t">• the split, thresholds and hurdle were fixed in advance</text>
  <text x="36" y="355" class="t">• no outcome statistic was ever computed on DEFINE</text>
  <text x="36" y="373" class="t">• the holdout is reported beside validate, not instead of it</text>
  <text x="36" y="391" class="t">• the verdict follows from the pre-stated rules</text>
  <text x="36" y="409" class="t">• the stopping-rule text matches the preregistration</text>

  <rect x="468" y="292" width="408" height="122" class="prv"/>
  <text x="480" y="317" class="ttl">A public reader CANNOT check</text>
  <text x="480" y="337" class="t">• that the commit really predates the analysis</text>
  <text x="480" y="355" class="t">• the hashes or their dates — the repo is private</text>
  <text x="480" y="373" class="wt">offered as provenance, not as proof</text>
  <text x="480" y="391" class="t">• the holdout is a FROZEN HISTORICAL split, not</text>
  <text x="480" y="409" class="t">  prospective — the data existed when the prereg was written</text>

  <text x="24" y="444" class="sm">DEFINE 2026-01-01 → 05-27 (thresholds only) · VALIDATE 05-27 → 07-15 (the verdict) · HOLDOUT 07-15 → 09-01 (opened last).</text>
  <text x="24" y="462" class="sm">All three windows are historical. The split controls for peeking and threshold-fitting; it does not make the test prospective.</text>
</svg>

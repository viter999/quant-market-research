<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <style>
    .bx  { fill:#4b5563; fill-opacity:.10; stroke:#6b7280; stroke-width:1.5; rx:8 }
    .fail{ fill:#b91c1c; fill-opacity:.12; stroke:#b91c1c; stroke-width:1.8; rx:8 }
    .pass{ fill:#15803d; fill-opacity:.12; stroke:#15803d; stroke-width:1.6; rx:8 }
    .open{ fill:#b45309; fill-opacity:.12; stroke:#b45309; stroke-width:1.8; rx:8; stroke-dasharray:5 3 }
    .t   { fill:#6b7280; font-size:12.5px }
    .ttl { fill:#374151; font-size:13.5px; font-weight:600 }
    .h   { fill:#374151; font-size:16px; font-weight:700 }
    .sm  { fill:#9ca3af; font-size:11.5px }
    .ar  { stroke:#9ca3af; stroke-width:1.6; fill:none; marker-end:url(#c) }
    .ft  { fill:#b91c1c; font-size:12px; font-weight:600 }
    .ot  { fill:#b45309; font-size:12px; font-weight:600 }
    @media (prefers-color-scheme: dark){
      .t{fill:#9ca3af} .ttl{fill:#d1d5db} .h{fill:#e5e7eb} .sm{fill:#6b7280}
    }
  </style>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>

  <text x="24" y="30" class="h">Whale Lab — how a failed study was handled</text>
  <text x="24" y="50" class="sm">Diagram (not a screenshot). Figures from the recorded integrity report and forensic artifacts.</text>

  <rect x="24" y="86" width="176" height="80" class="bx"/>
  <text x="36" y="111" class="ttl">Acquisition</text>
  <text x="36" y="130" class="t">16,861 source objects</text>
  <text x="36" y="148" class="t">~85 GB, manifest-verified</text>

  <rect x="240" y="86" width="176" height="80" class="bx"/>
  <text x="252" y="111" class="ttl">Integrity pass</text>
  <text x="252" y="130" class="t">8 gates, frozen rules</text>
  <text x="252" y="148" class="t">run before any analysis</text>

  <rect x="456" y="86" width="176" height="80" class="pass"/>
  <text x="468" y="111" class="ttl">4 gates PASS</text>
  <text x="468" y="130" class="t">canonicalization, actor</text>
  <text x="468" y="148" class="t">invariants, nulls, firewall</text>

  <rect x="672" y="86" width="204" height="80" class="fail"/>
  <text x="684" y="111" class="ttl">4 gates FAIL</text>
  <text x="684" y="130" class="t">containment, envelope,</text>
  <text x="684" y="148" class="t">duplicates, reconciliation</text>

  <rect x="672" y="200" width="204" height="86" class="fail"/>
  <text x="684" y="225" class="ttl">Recorded as FAILED</text>
  <text x="684" y="244" class="t">reconciliation 94.2351%</text>
  <text x="684" y="262" class="t">953,381 / 1,011,705</text>
  <text x="684" y="280" class="t">no model fitted</text>

  <rect x="400" y="200" width="232" height="86" class="bx"/>
  <text x="412" y="225" class="ttl">Forensic decomposition</text>
  <text x="412" y="244" class="t">duplicates proven to originate</text>
  <text x="412" y="262" class="t">upstream; 98.80% of failures</text>
  <text x="412" y="280" class="t">attributed — gate still fails</text>

  <rect x="150" y="200" width="212" height="86" class="open"/>
  <text x="162" y="225" class="ttl">702 residual parents</text>
  <text x="162" y="244" class="t">11 time-localised episodes;</text>
  <text x="162" y="262" class="t">archive-vs-venue attribution</text>
  <text x="162" y="280" class="ot">left UNRESOLVED</text>

  <rect x="240" y="330" width="392" height="66" class="bx"/>
  <text x="252" y="355" class="ttl">New preregistration, frozen and tagged</text>
  <text x="252" y="375" class="t">historical data demoted to development; 30-day prospective window; not yet run</text>

  <path class="ar" d="M200 126 L236 126"/>
  <path class="ar" d="M416 126 L452 126"/>
  <path class="ar" d="M632 126 L668 126"/>
  <path class="ar" d="M774 166 L774 196"/>
  <path class="ar" d="M668 243 L636 243"/>
  <path class="ar" d="M400 243 L366 243"/>
  <path class="ar" d="M256 286 L340 326"/>

  <text x="24" y="424" class="ft">The failure was never repaired, deduplicated or re-scored.</text>
  <text x="24" y="442" class="sm">The counterfactual is diagnostic only; the permanent record remains the failed result.</text>
</svg>

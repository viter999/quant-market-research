<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <style>
    .bx { fill:#4b5563; fill-opacity:.10; stroke:#6b7280; stroke-width:1.5; rx:8 }
    .fr { fill:#1d4ed8; fill-opacity:.12; stroke:#1d4ed8; stroke-width:1.8; rx:8 }
    .kl { fill:#b91c1c; fill-opacity:.12; stroke:#b91c1c; stroke-width:1.8; rx:8 }
    .t  { fill:#6b7280; font-size:12.5px }
    .ttl{ fill:#374151; font-size:13.5px; font-weight:600 }
    .h  { fill:#374151; font-size:16px; font-weight:700 }
    .sm { fill:#9ca3af; font-size:11.5px }
    .ar { stroke:#9ca3af; stroke-width:1.6; fill:none; marker-end:url(#b) }
    .arK{ stroke:#b91c1c; stroke-width:1.6; fill:none; marker-end:url(#bk) }
    .kt { fill:#b91c1c; font-size:12px; font-weight:600 }
    .ft { fill:#1d4ed8; font-size:12px; font-weight:600 }
    @media (prefers-color-scheme: dark){
      .t{fill:#9ca3af} .ttl{fill:#d1d5db} .h{fill:#e5e7eb} .sm{fill:#6b7280}
    }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>
    <marker id="bk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
  </defs>

  <text x="24" y="30" class="h">Research workflow — preregistration to verdict</text>
  <text x="24" y="50" class="sm">Diagram (not a screenshot). The freeze points are what make a negative result publishable.</text>

  <rect x="24" y="90" width="150" height="84" class="bx"/>
  <text x="36" y="115" class="ttl">Hypothesis</text>
  <text x="36" y="134" class="t">stated so it</text>
  <text x="36" y="152" class="t">can fail</text>

  <rect x="206" y="90" width="166" height="84" class="fr"/>
  <text x="218" y="115" class="ttl">Preregistration</text>
  <text x="218" y="134" class="t">question, hurdle,</text>
  <text x="218" y="152" class="t">stopping + reading rule</text>
  <text x="218" y="188" class="ft">committed + tagged first</text>

  <rect x="404" y="90" width="150" height="84" class="bx"/>
  <text x="416" y="115" class="ttl">Development</text>
  <text x="416" y="134" class="t">TRAIN /</text>
  <text x="416" y="152" class="t">VALIDATION only</text>

  <rect x="586" y="90" width="150" height="84" class="fr"/>
  <text x="598" y="115" class="ttl">Freeze</text>
  <text x="598" y="134" class="t">model + pipeline</text>
  <text x="598" y="152" class="t">tagged</text>
  <text x="598" y="188" class="ft">nothing changes after</text>

  <rect x="586" y="232" width="150" height="84" class="bx"/>
  <text x="598" y="257" class="ttl">Prospective test</text>
  <text x="598" y="276" class="t">one window,</text>
  <text x="598" y="294" class="t">one read</text>

  <rect x="404" y="232" width="150" height="84" class="bx"/>
  <text x="416" y="257" class="ttl">Verdict</text>
  <text x="416" y="276" class="t">by the rule written</text>
  <text x="416" y="294" class="t">before the data</text>

  <rect x="206" y="232" width="166" height="84" class="kl"/>
  <text x="218" y="257" class="ttl">Stopping rule fires</text>
  <text x="218" y="276" class="t">the family closes —</text>
  <text x="218" y="294" class="t">not renegotiated</text>

  <rect x="24" y="232" width="150" height="84" class="bx"/>
  <text x="36" y="257" class="ttl">Published</text>
  <text x="36" y="276" class="t">including, and</text>
  <text x="36" y="294" class="t">usually, a null</text>

  <path class="ar" d="M174 132 L202 132"/>
  <path class="ar" d="M372 132 L400 132"/>
  <path class="ar" d="M554 132 L582 132"/>
  <path class="ar" d="M661 174 L661 228"/>
  <path class="ar" d="M582 274 L558 274"/>
  <path class="arK" d="M404 274 L376 274"/>
  <path class="ar" d="M206 274 L178 274"/>

  <text x="24" y="356" class="sm">Integrity gates run before any analysis and block the pipeline. A failed gate ends the study and the failure</text>
  <text x="24" y="374" class="sm">is published — nothing is repaired to make a result appear.</text>
</svg>
